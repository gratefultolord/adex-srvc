services:
  postgres:
    image: postgres:16-alpine
    container_name: adex-postgres
    environment:
      POSTGRES_DB: adex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adex"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path", "/migrations",
        "-database", "postgres://postgres:postgres@postgres:5432/adex?sslmode=disable",
        "up"
      ]
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: adex-app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/adex?sslmode=disable
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      DSP_TIMEOUT: 200ms
      SHUTDOWN_TIMEOUT: 10s
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 5
  dsp-alpha:
    build:
      context: .
      dockerfile: Dockerfile
      target: mockdsp
    command:
      - "-port=9001"
      - "-status=200"

  dsp-beta:
    build:
      context: .
      dockerfile: Dockerfile
      target: mockdsp
    command:
      - "-port=9002"
      - "-status=500"

  dsp-gamma:
    build:
      context: .
      dockerfile: Dockerfile
      target: mockdsp
    command:
      - "-port=9003"
      - "-status=200"
      - "-delay=500ms"    

volumes:
  postgres_data: